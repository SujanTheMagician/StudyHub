<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/modules/todo.css" />
    <link rel="stylesheet" href="css/modules/timer.css" />
    <link rel="stylesheet" href="css/modules/notes.css" />
    <link rel="stylesheet" href="css/modules/habits.css" />
    <link rel="stylesheet" href="css/modules/calendar.css" />
    <link rel="stylesheet" href="css/modules/stats.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <!-- Sai Priyan – header, sidebar and dashboard layout go here -->

    <main>
      <!-- Sai Priyan – Dashboard home -->
      <section id="dashboard"></section>

      <!-- Sujan – Daily Quote -->
      <section id="quote"></section>

      <!-- Adil – To-Do List -->
      <section id="todo"></section>

      <!-- Ethan – Focus Timer (Pomodoro) -->
      <section id="timer"></section>

      <!-- Ashmitha – Notes -->
      <section id="notes"></section>

      <!-- Vignesh – Habit Tracker with streaks -->
      <section id="habits"></section>

      <!-- Jaden – Calendar and Planner -->
      <section id="calendar"></section>

      <!-- Anmol – Progress and Stats -->
      

<section id="stats">
  <div class="stats-heading">
    <div>
      <h2>Progress &amp; Stats</h2>
      <p>Your study progress at a glance</p>
    </div>
  </div>

  <div class="stats-grid">
    <article class="stats-card">
      <p>Tasks Completed</p>
      <h3 id="stats-tasks">0</h3>
    </article>

    <article class="stats-card">
      <p>Focus Hours</p>
      <h3 id="stats-focus">0h</h3>
    </article>

    <article class="stats-card">
      <p>Study Streak</p>
      <h3 id="stats-streak">0 days</h3>
    </article>
  </div>

  <article class="stats-card stats-chart-card">
    <h3>Focus Time — Last 7 Days</h3>
    <div class="stats-chart-wrapper">
      <canvas id="stats-chart"></canvas>
      <p id="stats-empty" hidden>No focus data recorded yet.</p>
    </div>
  </article>
</section>

      

    <script src="js/api.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/main.js"></script>
    <script src="js/modules/todo.js"></script>
    <script src="js/modules/timer.js"></script>
    <script src="js/modules/notes.js"></script>
    <script src="js/modules/habits.js"></script>
    <script src="js/modules/calendar.js"></script>
    <script src="js/modules/stats.js"></script>
    <script src="js/modules/quote.js"></script>






  </body>
</html>
