<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/modules/todo.css" />
    <link rel="stylesheet" href="css/modules/timer.css" />
    <link rel="stylesheet" href="css/modules/notes.css" />
    <link rel="stylesheet" href="css/modules/habits.css" />
    <link rel="stylesheet" href="css/modules/calendar.css" />
    <link rel="stylesheet" href="css/modules/stats.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="app-header">
      <a href="#dashboard" class="logo">StudyHub</a>

      <!-- Profile information will be populated dynamically -->
      <div class="user-info">
        <img
          id="profile-pic"
          src=""
          alt="Profile Picture"
          class="profile-pic"
        />

        <span id="user-name" class="user-name"></span>
      </div>
    </header>

    <aside class="sidebar">
      <nav aria-label="Main navigation">
        <a href="#dashboard">Dashboard</a>
        <a href="#quote">Daily Quote</a>
        <a href="#todo">To-Do List</a>
        <a href="#timer">Focus Timer</a>
        <a href="#notes">Notes</a>
        <a href="#habits">Habit Tracker</a>
        <a href="#calendar">Calendar and Planner</a>
        <a href="#stats">Progress and Stats</a>
      </nav>
    </aside>

    <main>
      <!-- Sai Priyan - Dashboard home -->
      <section id="dashboard">
        <h1>Dashboard</h1>
        <!-- Summary cards: presentation structure only -->
        <div class="dashboard-summary">
          <article class="summary-card">
            <h2>Tasks</h2>
            <p>Summary</p>
          </article>

          <article class="summary-card">
            <h2>Focus Time</h2>
            <p>Summary</p>
          </article>

          <article class="summary-card">
            <h2>Habits</h2>
            <p>Summary</p>
          </article>

          <article class="summary-card">
            <h2>Progress</h2>
            <p>Summary</p>
          </article>
        </div>
      </section>

      <!-- Sujan – Daily Quote -->
      <section id="quote"></section>

      <!-- Adil – To-Do List -->
      <section id="todo"></section>

      <!-- Ethan – Focus Timer (Pomodoro) -->
      <section id="timer"></section>

      <!-- Ashmitha – Notes -->
      <section id="notes"></section>

      <!-- Vignesh – Habit Tracker with streaks -->
      <section id="habits"></section>

      <!-- Jaden – Calendar and Planner -->
      <section id="calendar"></section>

      <!-- Anmol – Progress and Stats -->
      <section id="stats"></section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/main.js"></script>
    <script src="js/modules/todo.js"></script>
    <script src="js/modules/timer.js"></script>
    <script src="js/modules/notes.js"></script>
    <script src="js/modules/habits.js"></script>
    <script src="js/modules/calendar.js"></script>
    <script src="js/modules/stats.js"></script>
    <script src="js/modules/quote.js"></script>
  </body>
</html>
